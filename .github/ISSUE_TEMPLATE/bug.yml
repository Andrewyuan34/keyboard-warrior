name: Bug
description: Something is not working.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repeat
    attributes:
      label: How can we repeat it?
      description: Include the steps and your Unity version or build. A screenshot can help.
    validations:
      required: true

name: Task
description: A small piece of work for the team.
title: "[Task] "
body:
  - type: textarea
    id: task
    attributes:
      label: What needs doing?
      description: A few sentences are enough. Mention any task that must happen first.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How will we know it works?
      description: Two or three simple checks.
    validations:
      required: true
